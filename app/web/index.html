<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI Baby Monitor & Anti-Theft Security Notification Mobile App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Android Meta Tags -->
  <meta name="theme-color" content="#171B24">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Apple iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SafeHome AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Baby & SafeHome Security AI</title>
  <style>
    body {
      background-color: #11141B;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      text-align: center;
    }
    .app-icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3);
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #007AFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="App Icon" class="app-icon" />
    <div class="spinner"></div>
    <p style="margin-top: 16px; font-size: 14px; color: #8E8E93; font-weight: 500;">Đang kết nối hệ thống AI giám sát...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
